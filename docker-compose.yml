services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-WMS Material Request}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_R2_PUBLIC_BASE: ${VITE_R2_PUBLIC_BASE:-https://r2.example}
    container_name: wms-frontend
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    depends_on:
      - api
    restart: unless-stopped
